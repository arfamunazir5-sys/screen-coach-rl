name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        run: |
          git remote add hf https://rodaruu:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/rodaruu/screen-coach-rl
          git push hf main --force
