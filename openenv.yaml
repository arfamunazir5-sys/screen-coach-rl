name: digital-behavior-coach
version: "1.0.0"
description: >
  A reinforcement learning environment that simulates coaching a user
  toward healthier digital habits. The agent observes screen usage
  patterns and takes actions to optimize long-term wellbeing.

server:
  path: server/app.py
  host: 0.0.0.0
  port: 7860

observation_space:
  type: object
  properties:
    hour_of_day:
      type: integer
      description: Current hour of the day (0-23)
    screen_time_today:
      type: number
      description: Hours of screen use today
    app_category:
      type: string
      description: Type of app being used (social|work|entertainment)
    user_goal:
      type: string
      description: User stated goal (focus|sleep|balance)
    streak_days:
      type: integer
      description: Consecutive days of good behavior
    last_action_effect:
      type: string
      description: Result of last action taken
    resistance_level:
      type: number
      description: How likely user is to ignore interventions (0.0-1.0)
    habit_score:
      type: number
      description: Overall habit health score (0.0-1.0)

action_space:
  type: object
  properties:
    action_type:
      type: string
      description: One of send_reminder|block_app|encourage|do_nothing
    message:
      type: string
      description: Optional message to accompany the action

reward_range: [0.0, 1.0]

tasks:
  - id: easy
    name: "Remind Over-User"
    description: "Reduce screen time for a user exceeding 5 hours"
    difficulty: easy
  - id: medium
    name: "Late Night Sleep Intervention"
    description: "Help a user with sleep goal disengage late at night"
    difficulty: medium
  - id: hard
    name: "Full Day Balance"
    description: "Maintain healthy habits across a full day without over-intervening"
    difficulty: hard

tags:
  - digital-health
  - behavior-coaching
  - reinforcement-learning
  - screen-time
  - openenv
