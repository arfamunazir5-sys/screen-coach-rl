[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "screen-coach-rl"
version = "1.0.0"
description = "Digital Behavior Coach OpenEnv Environment"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "openai",
    "huggingface_hub",
    "PyYAML",
    "openenv-core>=0.2.0",
    "gradio==5.23.3",
    "plotly",
]

[project.scripts]
server = "server.app:main"
